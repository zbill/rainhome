<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 表盘 -->
  <circle cx="64" cy="64" r="42" fill="#ffffff"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0"/>

  <!-- 12/3/6/9 刻度 -->
  <g stroke="#c3cdf0" stroke-width="3.4" stroke-linecap="round">
    <line x1="64" y1="29" x2="64" y2="36"/>
    <line x1="64" y1="92" x2="64" y2="99"/>
    <line x1="29" y1="64" x2="36" y2="64"/>
    <line x1="92" y1="64" x2="99" y2="64"/>
  </g>

  <!-- 指针 10:10 -->
  <g stroke="url(#hand)" stroke-linecap="round">
    <!-- 时针 -->
    <line x1="64" y1="64" x2="44" y2="50" stroke-width="5"/>
    <!-- 分针 -->
    <line x1="64" y1="64" x2="93" y2="47" stroke-width="4"/>
  </g>

  <!-- 中心轴 -->
  <circle cx="64" cy="64" r="5" fill="#3a3f66"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff"/>
</svg>
