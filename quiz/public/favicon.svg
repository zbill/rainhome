<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 白色加减乘除符号：两行拉开，乘号左移 -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">

    <!-- 第一行：加 +、减 − -->
    <!-- 加 + -->
    <line x1="40" y1="30" x2="40" y2="52"/>
    <line x1="29" y1="41" x2="51" y2="41"/>

    <!-- 减 − -->
    <line x1="78" y1="41" x2="100" y2="41"/>

    <!-- 第二行：乘 ×、除 ÷ -->
    <!-- 乘号 × 缩小并左移 -->
    <line x1="32" y1="70" x2="48" y2="86"/>
    <line x1="48" y1="70" x2="32" y2="86"/>

    <!-- 除 ÷ -->
    <line x1="78" y1="78" x2="100" y2="78"/>
    <circle cx="89" cy="66" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="89" cy="90" r="4" fill="#ffffff" stroke="none"/>
  </g>
</svg>